<svg width="100%" height="auto" viewBox="0 0 1000 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="uplinkBg" x1="500" y1="0" x2="500" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#190F16"/>
      <stop offset="100%" stop-color="#0E080F"/>
    </linearGradient>

    <linearGradient id="btnGlow" x1="250" y1="90" x2="750" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E05A47"/>
      <stop offset="100%" stop-color="#FF7A59"/>
    </linearGradient>

    <pattern id="gridUp" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Panel Base -->
  <rect width="1000" height="160" rx="12" fill="url(#uplinkBg)"/>
  <rect width="1000" height="160" rx="12" fill="url(#gridUp)"/>
  <rect width="1000" height="160" rx="12" stroke="#E05A47" stroke-width="1.5"/>

  <!-- Corner Reticles -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#FF7A59" stroke-width="1.5" fill="none"/>
  <path d="M 988 24 L 988 12 L 976 12" stroke="#FF7A59" stroke-width="1.5" fill="none"/>
  <path d="M 12 136 L 12 148 L 24 148" stroke="#FF7A59" stroke-width="1.5" fill="none"/>
  <path d="M 988 136 L 988 148 L 976 148" stroke="#FF7A59" stroke-width="1.5" fill="none"/>

  <!-- Persistent System Status Header -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" letter-spacing="1.5">
    <circle cx="50" cy="32" r="3.5" fill="#22C55E">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="36" fill="#22C55E" font-weight="700">ARES CITY NETWORK // TELEMETRY MATRIX</text>
    <text x="950" y="36" fill="#00F0FF" text-anchor="end" font-weight="700">[ SIMULATION AVAILABLE ]</text>
  </g>

  <!-- Telemetry Baseline Bar -->
  <line x1="30" y1="48" x2="970" y2="48" stroke="#252636" stroke-width="1"/>
  
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" letter-spacing="1.5" fill="#8F95B2">
    <text x="50" y="68">UPLINK: <tspan fill="#22C55E" font-weight="700">STABLE</tspan></text>
    <text x="260" y="68">NODES: <tspan fill="#CDD6F4" font-weight="700">03</tspan></text>
    <text x="440" y="68">SYSTEM: <tspan fill="#FFB300" font-weight="700">BUILDING</tspan></text>
    <text x="660" y="68">RESEARCH: <tspan fill="#00F0FF" font-weight="700">03</tspan></text>
    <text x="950" y="68" text-anchor="end">DEPLOYMENTS: <tspan fill="#CDD6F4" font-weight="700">03</tspan></text>
  </g>

  <!-- Grand Climax CTA Button -->
  <rect x="250" y="90" width="500" height="48" rx="8" fill="url(#btnGlow)"/>
  <text x="500" y="120" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="2.5" text-anchor="middle">
    ENTER ARES CITY →
  </text>
</svg>
