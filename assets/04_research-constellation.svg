<svg width="100%" height="auto" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="resBg" x1="500" y1="0" x2="500" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#140F18"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="500" cy="125" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22">
        <animate attributeName="stop-opacity" values="0.15;0.32;0.15" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="65%" stop-color="#E05A47" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridRes" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Panel -->
  <rect width="1000" height="240" rx="12" fill="url(#resBg)"/>
  <rect width="1000" height="240" rx="12" fill="url(#gridRes)"/>
  <rect width="1000" height="240" rx="12" stroke="#252636" stroke-width="1.5"/>

  <!-- Corner Reticles -->
  <path d="M 14 24 L 14 14 L 24 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 986 24 L 986 14 L 976 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 14 216 L 14 226 L 24 226" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 986 216 L 986 226 L 976 226" stroke="#E05A47" stroke-width="1.5" fill="none"/>

  <!-- Top Header Bar -->
  <text x="35" y="28" fill="#8F95B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="2">
    05 / EXPERIMENTAL LAB // RESEARCH CONSTELLATION
  </text>
  <text x="965" y="28" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="end">
    [ STATE: EXPERIMENTAL LAB ]
  </text>

  <!-- Constellation Orbit Rings -->
  <circle cx="500" cy="125" r="105" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 4"/>
  <circle cx="500" cy="125" r="70" fill="url(#centerGlow)"/>

  <!-- Connecting Constellation Vectors -->
  <line x1="300" y1="125" x2="375" y2="125" stroke="#E05A47" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="300" cy="125" r="3" fill="#E05A47"/>

  <line x1="625" y1="110" x2="700" y2="76" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  <circle cx="700" cy="76" r="3" fill="#00F0FF"/>

  <line x1="625" y1="140" x2="700" y2="174" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  <circle cx="700" cy="174" r="3" fill="#FFB300"/>

  <!-- CENTRAL FOCUS: SPATIAL COMPUTING -->
  <rect x="375" y="100" width="250" height="50" rx="25" fill="#181324" stroke="#00F0FF" stroke-width="1.4"/>
  <text x="500" y="121" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">CORE VECTOR</text>
  <text x="500" y="138" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">SPATIAL COMPUTING</text>

  <!-- BRANCH 01: REAL-TIME C++ GRAPHICS (BUILDING) -->
  <rect x="50" y="101" width="250" height="48" rx="6" fill="#120E1A" stroke="#E05A47" stroke-width="1.2"/>
  <text x="66" y="119" fill="#E05A47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ ◐ BUILDING ]</text>
  <text x="66" y="137" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Real-Time C++ Graphics</text>

  <!-- BRANCH 02: ADAPTIVE BCI INTERFACES (RESEARCH) -->
  <rect x="700" y="52" width="250" height="48" rx="6" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="716" y="70" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ ○ RESEARCH ]</text>
  <text x="716" y="88" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Adaptive BCI / Attention</text>

  <!-- BRANCH 03: XR NAVIGATION HUDS (CONCEPT) -->
  <rect x="700" y="150" width="250" height="48" rx="6" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="716" y="168" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ ◇ CONCEPT ]</text>
  <text x="716" y="186" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">XR Navigation HUDs</text>
</svg>
