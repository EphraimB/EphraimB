<svg width="100%" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="resBg" x1="450" y1="0" x2="450" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#140F18"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="450" cy="110" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E05A47" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridRes" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Panel Base -->
  <rect width="900" height="220" rx="10" fill="url(#resBg)"/>
  <rect width="900" height="220" rx="10" fill="url(#gridRes)"/>
  <rect width="900" height="220" rx="10" stroke="#252636" stroke-width="1.5"/>

  <!-- Corner Reticles -->
  <path d="M 14 24 L 14 14 L 24 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 886 24 L 886 14 L 876 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 14 196 L 14 206 L 24 206" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 886 196 L 886 206 L 876 206" stroke="#E05A47" stroke-width="1.5" fill="none"/>

  <!-- Constellation Orbit Rings -->
  <circle cx="450" cy="110" r="100" stroke="#FFFFFF" stroke-opacity="0.04" stroke-dasharray="3 4"/>
  <circle cx="450" cy="110" r="65" fill="url(#centerGlow)"/>

  <!-- Connecting Constellation Vectors -->
  <line x1="270" y1="110" x2="330" y2="110" stroke="#E05A47" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="270" cy="110" r="3" fill="#E05A47"/>

  <line x1="570" y1="95" x2="630" y2="62" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <circle cx="630" cy="62" r="3" fill="#00F0FF"/>

  <line x1="570" y1="125" x2="630" y2="158" stroke="#FFB300" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <circle cx="630" cy="158" r="3" fill="#FFB300"/>

  <!-- CENTRAL FOCUS: SPATIAL COMPUTING -->
  <rect x="330" y="86" width="240" height="48" rx="24" fill="#181324" stroke="#00F0FF" stroke-width="1.4"/>
  <text x="450" y="107" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle">[ CORE RESEARCH VECTOR ]</text>
  <text x="450" y="123" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1" text-anchor="middle">SPATIAL COMPUTING</text>

  <!-- BRANCH 01: REAL-TIME C++ GRAPHICS (IN DEVELOPMENT) -->
  <rect x="40" y="86" width="230" height="48" rx="6" fill="#120E1A" stroke="#E05A47" stroke-width="1.2"/>
  <text x="54" y="104" fill="#E05A47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ IN DEVELOPMENT ]</text>
  <text x="54" y="122" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Real-Time C++ Graphics</text>

  <!-- BRANCH 02: ADAPTIVE BCI INTERFACES (RESEARCH) -->
  <rect x="630" y="38" width="230" height="48" rx="6" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="644" y="56" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ RESEARCH / CONCEPTUAL ]</text>
  <text x="644" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Adaptive BCI Interfaces</text>

  <!-- BRANCH 03: XR NAVIGATION HUDS (RESEARCH) -->
  <rect x="630" y="134" width="230" height="48" rx="6" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="644" y="152" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1">[ RESEARCH / CONCEPTUAL ]</text>
  <text x="644" y="170" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">XR Navigation HUDs</text>
</svg>
