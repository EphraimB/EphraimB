<svg width="100%" height="auto" viewBox="0 0 1000 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="500" y1="0" x2="500" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#140F18"/>
    </linearGradient>

    <pattern id="gridArch" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Panel -->
  <rect width="1000" height="170" rx="12" fill="url(#archBg)"/>
  <rect width="1000" height="170" rx="12" fill="url(#gridArch)"/>
  <rect width="1000" height="170" rx="12" stroke="#252636" stroke-width="1.5"/>

  <!-- Corner Reticles -->
  <path d="M 14 24 L 14 14 L 24 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 986 24 L 986 14 L 976 14" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 14 146 L 14 156 L 24 156" stroke="#E05A47" stroke-width="1.5" fill="none"/>
  <path d="M 986 146 L 986 156 L 976 156" stroke="#E05A47" stroke-width="1.5" fill="none"/>

  <!-- Top Header Bar -->
  <text x="35" y="28" fill="#8F95B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="2">
    04 / SYSTEM INSPECTION // ARCHITECTURE PIPELINE
  </text>
  <text x="965" y="28" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="700" letter-spacing="1" text-anchor="end">
    [ STATE: SYSTEM INSPECTION ]
  </text>

  <!-- Pipeline Signal Connectors with Animated Dashes -->
  <path d="M 315 90 L 375 90" stroke="#E05A47" stroke-width="1.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="375,90 368,86 368,94" fill="#E05A47"/>

  <path d="M 625 90 L 685 90" stroke="#E05A47" stroke-width="1.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" values="0;-14" dur="1s" repeatCount="indefinite"/>
  </path>
  <polygon points="685,90 678,86 678,94" fill="#E05A47"/>

  <!-- LAYER 01: CORE LANGUAGES -->
  <rect x="45" y="44" width="270" height="102" rx="8" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="62" y="68" fill="#E05A47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1.5">[ 01 // CORE ]</text>
  <text x="62" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">LANGUAGES</text>
  <text x="62" y="117" fill="#CDD6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">C · C++ · TypeScript · JavaScript</text>
  <text x="62" y="133" fill="#8F95B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5">Low-level memory &amp; math</text>

  <!-- LAYER 02: INTERFACE & SURFACE -->
  <rect x="375" y="44" width="250" height="102" rx="8" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="392" y="68" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1.5">[ 02 // SURFACE ]</text>
  <text x="392" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">INTERFACE &amp; UX</text>
  <text x="392" y="117" fill="#CDD6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">Next.js · React · Tailwind CSS</text>
  <text x="392" y="133" fill="#8F95B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5">Reactive spatial design</text>

  <!-- LAYER 03: RUNTIME & INFRASTRUCTURE -->
  <rect x="685" y="44" width="270" height="102" rx="8" fill="#120E1A" stroke="#2B2D42" stroke-width="1.2"/>
  <text x="702" y="68" fill="#FFB300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10" font-weight="700" letter-spacing="1.5">[ 03 // RUNTIME ]</text>
  <text x="702" y="93" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">INFRASTRUCTURE</text>
  <text x="702" y="117" fill="#CDD6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11">Linux · Git · Actions · Edge</text>
  <text x="702" y="133" fill="#8F95B2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5">Cloudflare &amp; Vercel pipelines</text>
</svg>
